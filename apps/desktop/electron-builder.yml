appId: com.lxe.agent
productName: LXE Agent
copyright: Copyright © 2026 LXE
asar: true
npmRebuild: false
compression: normal
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: ../../dist/desktop
  buildResources: build
files:
  - dist/**/*
extraResources:
  - from: ../../build/desktop-resources
    to: .
    filter:
      - "**/*"
  - from: build
    to: branding
    filter:
      - icon-win.png
      - icon-mac.png
      - tray-win.ico
      - tray-macTemplate.png
      - tray-macTemplate@2x.png
win:
  icon: icon-win.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LXE-Agent-${version}-windows-${arch}.${ext}
mac:
  icon: icon-mac.png
nsis:
  include: resources/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LXE Agent
  deleteAppDataOnUninstall: false
publish: null
