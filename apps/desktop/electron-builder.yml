appId: com.lxe.agent
productName: LXE Agent
copyright: Copyright © 2026 LXE
asar: true
npmRebuild: false
compression: normal
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: ../../dist/desktop
  buildResources: build
files:
  - dist/main.js
  - dist/preload.cjs
extraResources:
  - from: ../../build/desktop-resources
    to: .
    filter:
      - "**/*"
win:
  icon: icon-win.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LXE-Agent-${version}-windows-${arch}.${ext}
mac:
  icon: icon-mac.png
nsis:
  include: resources/installer.nsh
  useZip: true
  # electron-builder otherwise creates a differential 7z package while the
  # generated installer still selects the ZIP extraction plug-in.
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LXE Agent
  deleteAppDataOnUninstall: false
publish: null
