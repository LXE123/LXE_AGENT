appId: com.lxe.agent
productName: LXE Agent
copyright: Copyright © 2026 LXE
asar: true
npmRebuild: false
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: ../../dist/desktop
  buildResources: build
files:
  - dist/**/*
extraResources:
  - from: ../../build/desktop-resources
    to: .
    filter:
      - "**/*"
win:
  icon: icon-win.svg
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LXE-Agent-${version}-windows-${arch}.${ext}
mac:
  icon: icon-mac.svg
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LXE Agent
  deleteAppDataOnUninstall: false
publish: null
