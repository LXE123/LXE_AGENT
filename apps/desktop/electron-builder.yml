appId: com.lxe.agent
productName: LXE Agent
copyright: Copyright © 2026 LXE
asar: true
npmRebuild: false
compression: normal
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: ../../dist/desktop
  buildResources: build
files:
  - dist/main.js
  - dist/preload.cjs
  - dist/desktop-mcp.mjs
  - dist/automation-time-worker.mjs
  - dist/pty-host.cjs
  - dist/pty-runtime/**/*
asarUnpack:
  - dist/desktop-mcp.mjs
  - dist/automation-time-worker.mjs
  - dist/pty-host.cjs
  - dist/pty-runtime/**/*
win:
  icon: icon-win.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LXE-Agent-${version}-windows-${arch}.${ext}
mac:
  icon: icon-mac.png
nsis:
  include: resources/installer.nsh
  useZip: false
  differentialPackage: true
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LXE Agent
  deleteAppDataOnUninstall: false
publish: null
