name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels its unfinished run; runs on main always finish.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    name: verify:source
    # LXE ships for Windows and macOS only; Linux lacks the exec sandbox and app runtime.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen
      - run: bun run desktop:tools:fd
      - run: bun run verify:source
        env:
          PYTHONUTF8: "1"
