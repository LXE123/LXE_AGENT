[project]
name = "lxe-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "aiohttp>=3.11.16",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
    "pandas==3.0.0",
    "pillow>=10.0.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "requests==2.32.5",
    "selenium>=4.0.0",
    "urllib3==2.6.3",
    "xlrd>=2.0.0",
]

[project.scripts]
lxeskill = "lxeskill.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
